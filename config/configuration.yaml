timer:
  garage_doors_opened_timer:
    duration: '00:30:00'

envisalink:
  host: alarmpanel.bowman.com
  panel_type: DSC
  user_name: !secret evl_username
  password: !secret evl_password
# code: !secret dsc_code    # removed so HA will prompt for the code
  port: 4025
  evl_version: 4
  keepalive_interval: 60
  zonedump_interval: 30
  timeout: 10
  panic_type: Police
  zones:
    1:
      name: 'Front Door'
    2:
      name: 'MudRoom Door'
    3:
      name: 'Foyer Motion'
    4:
      name: 'Deck Slider'
    5:
      name: 'Basement Door'
    6:
      name: 'Basement Motion'
  partitions:
    1:
      name: 'Home Alarm'

entity_controller:
  garage_lights:
    sensor:
      - binary_sensor.mudroom_door
      - binary_sensor.garagecammotiondetected
      - binary_sensor.garage_walk_in_door_contact
    entities:
      - light.mudroom_shelly_mudroom_garagelights
      - light.garage_workbench_lights
    state_attributes_ignore:
      - uptime
      - device_temp
      - rssi
      - rssi_level
      - voltage
      - current_consumption
      - total_consumption
      - supported_features
      - has_firmware_update
      - latest_fw_version
      - firmware_version
      - latest_beta_fw_version
    delay: 240
    block_timeout: 7200
    backoff: true
    backoff_factor: 1.1
    backoff_max: 1800
  front_outside_lights:
    sensor:
      - binary_sensor.front_door
      - binary_sensor.frontdoorcammotiondetected
      - binary_sensor.garage_walk_in_door_contact
    entities:
      - light.mudroom_shelly_mudroom_frontlights
      - light.front_outside_garage_light
      - light.front_step_light
    state_attributes_ignore:
      - uptime
      - device_temp
      - rssi
      - rssi_level
      - voltage
      - current_consumption
      - total_consumption
      - supported_features
      - has_firmware_update
      - latest_fw_version
      - firmware_version
      - latest_beta_fw_version
    delay: 420
    start_time: 'sunset + 00:10:00'
    end_time: 'sunrise - 00:10:00'
    block_timeout: 21600
    backoff: true
    backoff_factor: 1.25
    backoff_max: 900
  patio_outside_lights:
    sensor:
      - binary_sensor.basement_door
      - binary_sensor.basement_motion
      - binary_sensor.pationorthcammotiondetected
      - binary_sensor.patiosouthcammotiondetected
      - binary_sensor.pool_gate_contact
      - binary_sensor.basement_motion_sensor_occupancy
    entities:
      - light.patiosouthlight
      - light.pationorthlight
      - light.basement_light
    delay: 300
    start_time: 'sunset + 00:10:00'
    end_time: 'sunrise - 00:10:00'
    block_timeout: 21600
    backoff: true
    backoff_factor: 1
    backoff_max: 1200
    overrides:
      - input_boolean.boolean_disable_patio_lights
  basement_lights:
    sensor:
      - binary_sensor.basement_door
      - binary_sensor.basement_motion
      - binary_sensor.basement_motion_sensor_occupancy
    entities:
      - light.basement_light
    delay: 300
    start_time: 'sunset'
    end_time: 'sunrise'
    block_timeout: 1800
    backoff: true
    backoff_factor: 1
    backoff_max: 1800

