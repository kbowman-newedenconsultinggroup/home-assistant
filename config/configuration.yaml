###############################################################################
# Template entities (modern syntax)
# Legacy "platform: template" entities were removed in Home Assistant 2026.6.
# default_entity_id keeps the same entity IDs as before, so automations,
# dashboards, Alexa and entity_controller keep working.
###############################################################################
template:
  - light:
      - name: mudroom_shelly_mudroom_frontlights
        unique_id: template_light_mudroom_shelly_mudroom_frontlights
        default_entity_id: light.mudroom_shelly_mudroom_frontlights
        state: "{{ is_state('switch.mudroom_shelly_mudroom_frontlights', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.mudroom_shelly_mudroom_frontlights
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.mudroom_shelly_mudroom_frontlights
      - name: mudroom_shelly_mudroom_garagelights
        unique_id: template_light_mudroom_shelly_mudroom_garagelights
        default_entity_id: light.mudroom_shelly_mudroom_garagelights
        state: "{{ is_state('switch.mudroom_shelly_mudroom_garagelights', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.mudroom_shelly_mudroom_garagelights
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.mudroom_shelly_mudroom_garagelights

  # switch to invert state of officecam (off is no modetect, on is modetect)
  # so when office is "off" modetect is "on"
  - switch:
      - name: officecam_state_inversion
        unique_id: template_switch_officecam_state_inversion
        default_entity_id: switch.officecam_state_inversion
        state: "{{ is_state('switch.officecam_state', 'off') }}"
        turn_on:
          - action: switch.turn_off
            target:
              entity_id: switch.officecam_state
        turn_off:
          - action: switch.turn_on
            target:
              entity_id: switch.officecam_state

  # Weather station (values come from the sensor.weatherstation REST sensor)
  - sensor:
      - name: OutsideTemperature
        unique_id: template_sensor_outside_temperature
        default_entity_id: sensor.outside_temperature
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('outTemp') }}"
        unit_of_measurement: "°F"
      - name: TodayRain
        unique_id: template_sensor_rainfall
        default_entity_id: sensor.rainfall
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('dayRain') }}"
        unit_of_measurement: "in"
      - name: Windspeed
        unique_id: template_sensor_windspeed
        default_entity_id: sensor.windspeed
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('windSpeed') }}"
        unit_of_measurement: "mph"
      - name: Humidity
        unique_id: template_sensor_humidity
        default_entity_id: sensor.humidity
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('humidity') }}"
        unit_of_measurement: "%"
      - name: Barometer
        unique_id: template_sensor_barometer
        default_entity_id: sensor.barometer
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('barometer') }}"
        unit_of_measurement: "inHg"
      - name: BarometerTrend
        unique_id: template_sensor_barometertrend
        default_entity_id: sensor.barometertrend
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('barometerTrendData') }}"
        unit_of_measurement: "inHg"
      - name: WindChill
        unique_id: template_sensor_windchill
        default_entity_id: sensor.windchill
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('windChill') }}"
        unit_of_measurement: "°F"
      - name: HeatIndex
        unique_id: template_sensor_heatindex
        default_entity_id: sensor.heatindex
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('heatIndex') }}"
        unit_of_measurement: "°F"
      - name: HighTempToday
        unique_id: template_sensor_maxouttemp
        default_entity_id: sensor.maxouttemp
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('outTempMax') }}"
        unit_of_measurement: "°F"
      - name: LowTempToday
        unique_id: template_sensor_minouttemp
        default_entity_id: sensor.minouttemp
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('outTempMin') }}"
        unit_of_measurement: "°F"
      - name: WeeklyRain
        unique_id: template_sensor_weeklyrain
        default_entity_id: sensor.weeklyrain
        state: "{{ (state_attr('sensor.weatherstation', 'current') or {}).get('weeklyRain') }}"
        unit_of_measurement: "in"

      # small garage door
      - name: Small Door
        unique_id: template_sensor_small_garage_status
        default_entity_id: sensor.small_garage_status
        state: >-
          {%- set door = state_attr('cover.small_garage_door', 'door_state') -%}
          {%- if states.cover.small_garage_door is none -%} n/a
          {%- elif door == 'open' -%} Open
          {%- elif door == 'closed' -%} Closed
          {%- elif door == 'opening' -%} Opening
          {%- elif door == 'closing' -%} Closing
          {%- else -%} Unknown
          {%- endif -%}
      - name: Jaguar in Garage
        unique_id: template_sensor_garage_car_present
        default_entity_id: sensor.garage_car_present
        state: >-
          {%- set dist = state_attr('cover.small_garage_door', 'distance_sensor') -%}
          {%- if states.cover.small_garage_door is none -%} n/a
          {%- elif is_state('cover.small_garage_door', 'open') -%} n/a
          {%- elif dist is number and 65 < dist < 250 -%} Yes
          {%- else -%} No
          {%- endif -%}

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
